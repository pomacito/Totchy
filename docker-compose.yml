services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: status_terytorii
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/status_terytorii?schema=public
      APP_BASE_URL: http://localhost:3000
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-dev-only-change-me}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/.storage
      DEMO_DATA_MODE: "true"
    ports:
      - "3000:3000"
    volumes:
      - app-storage:/app/.storage

volumes:
  db-data:
  app-storage:
